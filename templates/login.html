{% extends "base.html" %}
{% block title %}Masuk - SaveMoney{% endblock %}
{% block body %}
<main class="auth-page">
  <section class="auth-card">
    <div class="brand">💼 SaveMoney</div>
    <h1>Selamat datang kembali</h1>
    <p class="muted">Masuk untuk melihat catatan keuanganmu.</p>
    <form method="post" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Username
        <input name="username" value="{{ username }}" required autocomplete="username">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button class="btn primary" type="submit">Masuk</button>
    </form>
    <p class="auth-switch">Belum punya akun? <a href="{{ url_for('register') }}">Daftar</a></p>
  </section>
</main>
{% endblock %}
